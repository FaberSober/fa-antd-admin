# ------------------------------- 开发环境 -------------------------------
server:
  port: 80
spring:
  application:
    name: fa-admin-dev
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fa_admin_dev?useUnicode=true&characterEncoding=UTF8&serverTimezone=GMT%2B8&useSSL=false&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      prefix: ${REDIS_PREFIX:fa-admin-dev} #默认key前缀
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 2
          # 连接池中的最小空闲连接
          min-idle: 0

  elasticsearch:
    uris: http://${ES_HOST:127.0.0.1}:${ES_PORT:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:123456}

easy-es:
  enable: true #默认为true,若为false则认为不启用本框架
  address: ${ES_HOST:127.0.0.1}:${ES_PORT:9200} # es的连接地址,必须含端口 若为集群,则可以用逗号隔开 例如:127.0.0.1:9200,127.0.0.2:9200
  username: ${ES_USERNAME:elastic} #若无 则可省略此行配置
  password: ${ES_PASSWORD:123456} #若无 则可省略此行配置
  global-config:
    print-dsl: true
    db-config:
      index-prefix: fa-admin-dev-

logging:
  level:
    tracer: trace

fa:
  license:
    enabled: false
    mode: online
    # 不要带结尾斜杠，客户端会自动拼接 /api/v1/license/validate
    server-url: ${FA_LICENSE_SERVER_URL:https://fa.ai.dward.cn}
    license-key: ${FA_LICENSE_KEY:}
    product: ${FA_LICENSE_PRODUCT:fa-ai-admin}
    client-version: ${FA_LICENSE_CLIENT_VERSION:1.0.0}
    # 目录必须存在或可由进程创建，并且需要持久化
    cache-file: ${FA_LICENSE_CACHE_FILE:./config/license-cache.lic}
    refresh-interval-seconds: ${FA_LICENSE_REFRESH_INTERVAL_SECONDS:3600}
    # 填写授权中心私钥对应的 PUBLIC KEY
    public-key: ${FA_LICENSE_PUBLIC_KEY:/Users/test/code/my/fa-ai/fa-ai-admin/config/license/public-key.pem}
  setting:
    url:
      phpRedisAdmin: ${phpRedisAdmin:http://127.0.0.1:8090}
      kkFileView: ${kkFileView:http://127.0.0.1:8091}
    # onlyoffice在线编辑office文件支持
    onlyoffice:
      # ONLYOFFICE_SERVER
      onlyofficeServer: ${onlyofficeServer:http://127.0.0.1:8092/}
      # 本服务提供给onlyoffice回调的服务器地址
      callbackServer: ${callbackServer:http://127.0.0.1:80/}

license-center:
  private-key-file: ${LICENSE_CENTER_PRIVATE_KEY_FILE:}
  online-license-ttl-seconds: ${LICENSE_CENTER_ONLINE_LICENSE_TTL_SECONDS:259200}
  grace-period-seconds: ${LICENSE_CENTER_GRACE_PERIOD_SECONDS:259200}
